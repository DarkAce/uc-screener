<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC Scanner - Upper Circuit Stock Screener</title>
    <meta name="description" content="Real-time NSE stock screener for upper circuit (UC) stocks. Identifies stocks hitting consecutive upper circuits using actual bhavcopy data.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-pattern"></div>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div>
                    <h1>UC Scanner</h1>
                    <p class="subtitle">Upper Circuit Stock Screener</p>
                    <p class="session-dates" id="session-dates">Click below to fetch live data</p>
                </div>
                <div class="header-right">
                    <button id="generate-btn" class="generate-btn" onclick="fetchLiveData()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        Fetch UC Data
                    </button>
                    <div class="status-container">
                    <div class="last-updated">
                        <span id="time-display"></span>
                        <button id="refresh-btn" class="refresh-btn" title="Refresh data" style="display:none">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="cors-note">Connecting...</div>
                    </div>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stat-card stat-fire">
                    <div class="stat-value" id="stat-consecutive">0</div>
                    <div class="stat-label">Consecutive UC 🔥</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-today">0</div>
                    <div class="stat-label" id="stat-today-label">Session 1 UC</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-yesterday">0</div>
                    <div class="stat-label" id="stat-yesterday-label">Session 2 UC</div>
                </div>
            </div>

            <div class="controls-bar">
                <div class="search-box">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-input" placeholder="Search symbol or name...">
                </div>
                <div class="sort-box">
                    <select id="sort-select">
                        <option value="change">Sort by % Change</option>
                        <option value="volume">Sort by Volume</option>
                        <option value="alpha">Sort Alphabetically</option>
                    </select>
                </div>
                <button id="deep-scan-btn" class="deep-scan-btn" style="display: none;">
                    🧠 Deep Scan
                </button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="consecutive">2-Day UC 🔥</button>
                <button class="tab-btn" data-tab="3day">3-Day UC 🔥🔥</button>
                <button class="tab-btn" data-tab="5day">5-Day UC 🚀</button>
                <button class="tab-btn" data-tab="today">Session 1 UC</button>
                <button class="tab-btn" data-tab="yesterday">Session 2 UC</button>
                <button class="tab-btn" data-tab="ipo">IPO Dashboard 🚀</button>
                <button class="tab-btn" data-tab="momentum">Momentum 📈</button>
                <button class="tab-btn" data-tab="swing">Swing Ideas 🎯</button>
            </div>
        </header>

        <main>
            <div id="stocks-container" class="stocks-grid">
                <div class="empty-state">
                    <div class="empty-icon">📈</div>
                    <h3>Ready to Scan</h3>
                    <p>Click "Fetch UC Data" at the top to download the latest Bhavcopy and find Upper Circuit stocks.</p>
                </div>
            </div>
            <div id="ipo-container" class="ipo-table-container" style="display: none;">
                <!-- IPOs will render here -->
            </div>
            <div id="momentum-container" class="ipo-table-container" style="display: none;">
                <!-- Momentum stocks will render here -->
            </div>
            <div id="swing-container" class="swing-grid" style="display: none;">
                <!-- Swing strategies will render here -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC Scanner - Upper Circuit Stock Screener</title>
    <meta name="description" content="Real-time NSE stock screener for upper circuit (UC) stocks. Identifies stocks hitting consecutive upper circuits using actual bhavcopy data.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>UC Scanner</h1>
                <span class="session-dates" id="session-dates">NSE India</span>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Dashboards</div>
                    <button class="tab-btn active" data-tab="portfolio"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg> Portfolio</button>
                    <button class="tab-btn" data-tab="ipo"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M2 12h4l3-9 5 18 3-9h5"></path></svg> IPO Center</button>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Screeners</div>
                    <button class="tab-btn" data-tab="consecutive"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> 2-Day UC</button>
                    <button class="tab-btn" data-tab="3day"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> 3-Day UC</button>
                    <button class="tab-btn" data-tab="5day"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon><circle cx="12" cy="12" r="1"></circle></svg> 5-Day UC</button>
                    <button class="tab-btn" data-tab="today"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> Session 1 UC</button>
                    <button class="tab-btn" data-tab="yesterday"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="20" x2="18" y2="4"></line><line x1="12" y1="20" x2="12" y2="10"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg> Session 2 UC</button>
                    <button class="tab-btn" data-tab="momentum"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg> Momentum</button>
                    <button class="tab-btn" data-tab="swing"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg> Swing Ideas</button>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Events</div>
                    <button class="tab-btn" data-tab="earnings"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Q2 Results</button>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="status-container">
                    <span class="cors-note">Live Mode</span>
                    <span id="time-display"></span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-area">
            <!-- Dynamic Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <h2 id="page-title">Portfolio Dashboard</h2>
                    <div class="metrics-strip">
                        <div class="stat-card stat-fire">
                            <div class="stat-value" id="stat-consecutive">0</div>
                            <div class="stat-label">Consecutive UC</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-today">0</div>
                            <div class="stat-label" id="stat-today-label">Session 1 UC</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-yesterday">0</div>
                            <div class="stat-label" id="stat-yesterday-label">Session 2 UC</div>
                        </div>
                    </div>
                </div>
                
                <div class="top-bar-right">
                    <div class="controls-bar">
                        <div class="search-box">
                            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="search-input" placeholder="Search symbol...">
                        </div>
                        <div class="sort-box">
                            <select id="sort-select">
                                <option value="change">Sort by % Change</option>
                                <option value="volume">Sort by Volume</option>
                                <option value="alpha">Sort Alphabetically</option>
                            </select>
                        </div>
                        <button id="deep-scan-btn" class="deep-scan-btn" style="display: none;">
                            🧠 Deep Scan
                        </button>
                        <button id="earnings-refresh-btn" class="deep-scan-btn" style="display: none;" onclick="fetchEarningsData()">
                            🔄 Refresh Data
                        </button>
                    </div>
                    <button id="generate-btn" class="generate-btn" onclick="fetchLiveData()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        Fetch UC Data
                    </button>
                </div>
            </header>

            <!-- Container Injection -->
            <main class="content-scroll-area">
                <div id="stocks-container" class="stocks-grid" style="display: none;">
                    <div class="empty-state">
                        <div class="empty-icon">📈</div>
                        <h3>Ready to Scan</h3>
                        <p>Click "Fetch UC Data" to download the latest Bhavcopy.</p>
                    </div>
                </div>
                <div id="ipo-container" class="ipo-table-container" style="display: none;"></div>
                <div id="momentum-container" class="ipo-table-container" style="display: none;"></div>
                <div id="swing-container" class="swing-grid" style="display: none;"></div>
                <div id="portfolio-container" class="portfolio-container" style="display: block;"></div>
                <div id="earnings-container" class="earnings-container" style="display: none;"></div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
